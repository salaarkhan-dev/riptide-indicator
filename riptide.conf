# Riptide scanner — runtime settings.
#
# Edit this file on GitHub (web or mobile app), commit, and the server picks it
# up within ~5 minutes and restarts itself. No SSH needed.
#
# This file is PUBLIC to anyone who can read the repo. Secrets never go here —
# TELEGRAM_TOKEN and TELEGRAM_CHAT_ID live in /home/ubuntu/riptide/.env, mode
# 600, and are not in git.
#
# systemd reads this as an EnvironmentFile: KEY=value, no quotes, no `export`,
# no spaces around `=`. Lines starting with # are ignored.
#
# Full reference: README_riptide_bot.md

# ── what to scan ────────────────────────────────────────────────────────────
RIPTIDE_INTERVAL=Min30

# Min60 ADDED 11 SEP, AND NOT BECAUSE IT WON. research/studies/timeframes.py
# measured all four timeframes on the same 59 symbols over the same 333 days
# and NO pair separates at even 1 SE, so "1h is better" is not a claim this
# repo can make. What it can say is why 1h is worth having anyway:
#
#   - it is the cheapest stream. fee in R is fee_pct/risk_pct and the median
#     1h stop is 1.97% against 0.97% on 15m, so the fee eats 16% of the gross
#     edge on 1h and 67% on 15m. GROSS, Min15 and Min30 are identical at
#     +0.054 and +0.055 R per bet -- the 15m deficit is entirely cost.
#   - it is the least noisy per unit of edge: 9.2 alerts a day per 59 symbols
#     against 27.9 on 15m, at roughly twice the R per alert.
#   - the risk band, fitted on Min30 confirmed, transfers to it. In
#     research/studies/poi_risk.py the band separates in all eighteen POI arms
#     with eighteen positive differences.
#
# COSTS: one more kline request per symbol per cycle (240 -> 360 at 120
# symbols; SCAN_INTERVAL is unchanged, still driven by Min15), about 21% more
# alerts, and a position slot held roughly twice as long as a 30m trade --
# median hold 8h against 4h. On CONFIRMED signals the slot-adjusted edge is
# identical to Min30, so the advantage is an all-signal phenomenon. Remove
# Min60 from the list to undo; nothing else changes.
RIPTIDE_INTERVALS=Min30,Min15,Min60
RIPTIDE_POI_REQUIRED=1
RIPTIDE_MIN_GRADE=B

# ── which ONE alert to take out of a market move ────────────────────────────
# A move raids pools on dozens of perpetuals at once, and each can print on
# 15m, 30m and 1h. That is one idea arriving as many messages. The bot names
# ONE of them; every other alert still sends in full and points at it.
#
# This is the largest measured effect in the bot. Scored causally on 333 days,
# 9071 filled trades (research/studies/pick_rule.py), on a 300 USDT account at
# 1% risk with at most ten positions open:
#
#     take every alert                    55.4/day   recovery 0.13    -51%
#     one per bar per tf (before 11 Sep)  36.0/day   recovery 1.39   +104%
#     one per 120m, rolling, all tfs      17.7/day   recovery 6.66   +501%
#
# COOLDOWN LENGTH. Four were scored; 120 minutes wins and is not winning by
# trading less — total R is flat from 60 to 120 (212.6 against 209.7) while the
# drawdown nearly halves, and 120 beats 60 in BOTH halves of the window.
#
#     30m   29.8/day   recov 3.04   1st half 0.49   +410%   acctDD 61%
#     60m   23.6/day   recov 3.71   1st half 1.21   +375%   acctDD 45%
#    120m   17.7/day   recov 6.66   1st half 3.31   +501%   acctDD 28%
#    240m   12.5/day   recov 7.68   1st half 3.46   +282%   acctDD 20%
#
# ROLLING, NOT A CLOCK BUCKET. Once a pick is named nothing overrides it for
# the next 120 minutes, so a target you acted on at 11:30 is never contradicted
# at 12:00 — the later alert points back at it and says how long ago. Trying to
# do better than that was measured and failed: quality gates on claiming, and
# delaying the decision to see more candidates, are eighteen-for-eighteen worse
# (research/studies/pick_hybrid.py).
#
# RIPTIDE_PICK_COOLDOWN_MIN=120
# RIPTIDE_PICK_ORDER=tf          # or "band"; see riptide/decide.py
# RIPTIDE_EVENT_PICK=0           # turns the whole rule off

# Comma separated, no spaces. Delete this line entirely to scan every USDT
# perpetual above RIPTIDE_MIN_VOL of 24h turnover (~96 symbols at the default).
# Left blank on purpose: the universe is now discovered as the
# RIPTIDE_TOP_N most liquid crypto perps, refreshed every 6 hours.
# Setting it back to an explicit list overrides all of that.
#RIPTIDE_SYMBOLS=

# Place entries on a lower timeframe. Structure — pool, sweep, shift — is still
# found on RIPTIDE_INTERVAL above; only the entry and stop move to the first gap
# on this timeframe after the shift confirms.
#
# Uncomment to enable. Measured over 12.5 days on 20 symbols:
#
#   Min30 gap + Min30 stop   45% of setups filled, 48% of fills reached 1R
#   Min15 gap + Min15 stop   85% of setups filled, 51% of fills reached 1R
#
# The cost is latency, not accuracy. A Min15 gap cannot exist until three
# Min15 candles have closed from the shift bar's open, so setup alerts arrive
# LATER than they would on Min30 — median +60 min, quartiles +15 and +120.
# You trade a later alert for one that can actually be filled.
#
# Also: two candle fetches per symbol, and the scan wakes every 15 minutes
# rather than every 30.
#
# Those numbers come from one market regime and fewer than a hundred filled
# samples per variant, with no fees or slippage. Enough to justify trying it,
# not enough to size a position on.
# Turned off after measuring it. On 816 paired setups over 20.8 days the Min15
# entry filled 85% against 45% for Min30 — and scored the same:
#
#   M30 sweep -> M30 entry   -0.032 R/setup +/- 0.035
#   M30 sweep -> M15 entry   -0.051 R/setup +/- 0.049
#   paired difference        -0.020 R  (-0.4 SE)  -- within noise
#
# Filling twice as often produced proportionally more wins AND more losses.
# Fill rate was the wrong thing to optimise. With no measurable gain, the
# higher timeframe wins on everything else: alerts an hour sooner, half the
# requests, and none of the refine/hold/grace machinery.
# RIPTIDE_ENTRY_INTERVAL=Min15

# How long to hold a setup waiting for a lower-timeframe gap before falling
# back to the higher-timeframe entry, in HTF bars. The gap cannot exist at the
# first scan after the shift, so this must be at least 1.
# RIPTIDE_MTF_GRACE_BARS=2

# ── alerting ────────────────────────────────────────────────────────────────
# The no-shift strategy: sweep -> first imbalance, entry at the gap edge, stop
# just beyond the raid extreme. Runs BESIDE the confirmed setup, not instead
# of it; both fire independently on the same sweep and every alert is labelled
#
#   ⚡ EARLY      sweep -> FVG · no shift yet
#   🅑 CONFIRMED  sweep -> shift -> FVG
#
# Why it exists: waiting for the shift is the safer read and also the slow
# one. By the time the shift prints, the move it confirms has happened. On
# PEPE 5 Sep the confirmed alert arrived at 23:00 with 1.76% risk; the early
# one fired at 09:30, four bars after the raid, with 0.78% risk — and price
# reached about 9R from there.
#
# Measured, 50 symbols, 41.6 days:
#
#                    signals   filled   median risk   1R/signal   3R/signal
#   ⚡ early            4666      79%         1.19%      +0.032      +0.023
#   🅑 confirmed        2040      50%         1.53%      +0.051      +0.043
#
#   trend-aligned, 3R target       early +0.098 ± 0.031
#                                  confd +0.081 ± 0.036
#
# Read that carefully. Early is NOT better per signal — at a 1R target it is
# worse, and clearly so on trend-aligned signals (+0.035 vs +0.099). It fires
# 2.3x as often and fills 79% against 50%, so it produces roughly 3.6x as many
# actual trades, and it loses 37% of them against 21%. There is no shift
# confirming the reversal: a pool taken mid-trend simply keeps going.
#
# The "it wants a FAR target" reading above was measured GROSS, unpaired, on a
# different window, and it does NOT survive being measured properly. Scored
# paired on the same 1374 early signals with fees, 23 symbols over 41.6 days:
#
#   target   hit tgt   stopped   gross     NET
#   1R          42%       36%   +0.057   -0.016
#   2R          26%       47%   +0.078   +0.006
#   3R          17%       52%   +0.067   -0.006
#
#   3R minus 1R, paired: +0.010 (+0.3 SE), and the window halves disagree.
#
# So early is within noise of zero after costs at every exit tested — three
# targets, two horizons, and a break-even variant. The fee part of that older
# note was right and is worse than it looked: early's median cost is 0.066 R
# against 0.044 R for the confirmed setup, because a tighter stop and a higher
# fill rate mean it pays the round trip more often on a smaller denominator.
# That is structural, not a quirk of one window.
#
# Kept ON regardless, for two reasons. Nothing here says early LOSES money —
# it says it does not clearly make any, gross of the live sample that has not
# been collected yet. And band A early is nominally +0.093 at 3R, which is the
# kind of thing /stats exists to settle rather than assume.
#
# Set to 0 if the alert volume is not worth that: early is roughly two thirds
# of all entry alerts.
#
# /stats reports the two separately so live data can settle it. 0 disables.
RIPTIDE_EARLY_ALERTS=1

# Sweep heads-ups. 0 turns them off and leaves only finished setups.
RIPTIDE_SWEEP_ALERTS=1
RIPTIDE_SWEEP_INTERVALS=Min30
RIPTIDE_SWEEP_WATCH_ONLY=1

# The third term in the WATCH gate: the raid bar's turnover against the median
# of the 50 bars before it. Below this the raid was QUIET, and quiet raids are
# the ones that reverse. 0 turns the test off.
#
# Measured live on 60 symbols, sweeps that would actually be SENT:
#
#     0     (off, the old behaviour)   44.2 a day
#     0.98  quietest fifth  <- now     15.7 a day   -64%
#     1.55  quietest two fifths        25.7 a day   -42%
#     2.37  quietest three fifths      34.6 a day   -22%
#
# WHAT IT BUYS AND WHAT IT COSTS. The hit rate — the share of raids that go on
# to produce a setup — goes from about 13% to about 18%, a third better. The
# absolute number of converting raids you see FALLS, because 64% fewer messages
# is a bigger cut than a third better hit rate: roughly 5.9 converting sweeps a
# day become roughly 2.8. That is the right trade only while attention is the
# scarce thing rather than opportunity. Raise it if the chat goes too quiet.
RIPTIDE_MAX_SWEEP_RVOL=1.55
RIPTIDE_POI_SWEEPS=1

# Which pools raise a heads-up. Unset = all, which is what you want while
# checking output against the chart. Narrow to Pivot later if the volume is too
# high — it converts best: 28% of pivot sweeps become setups, against 9% for
# Day and 0% for Week over 41.6 days on 50 symbols.
#
# Converting often and scoring well are different questions, though. Day
# setups score +0.094 +/- 0.035 against Pivot's +0.048 +/- 0.017 — Pivot
# converts three times as often and is no better per setup, and the gap
# between them is 1.2 SE, which is nothing.
# RIPTIDE_SWEEP_SRC=Pivot

# Timezone for the daily heartbeat. Display only — bar alignment and every
# internal calculation stay on UTC. IANA name.
RIPTIDE_TZ=Asia/Karachi

# Telegram send attempts. Retries only failures that provably did not deliver
# (rate limit, 5xx, connection refused); an ambiguous timeout is never retried,
# so an alert can be lost but never duplicated.
RIPTIDE_TG_RETRIES=4

# Accept /status /scan /pause /resume /update /restart from Telegram. Only
# TELEGRAM_CHAT_ID is obeyed; everyone else is ignored without a reply. There
# is still no exchange key and no order path anywhere in the bot. 0 disables.
RIPTIDE_TG_COMMANDS=1

# ── trend filter ────────────────────────────────────────────────────────────
# Only take signals facing the higher-timeframe trend. This is the strongest
# result measured in this project — and the reference indicator exposes the
# same filter, shipped switched off.
#
# 50 symbols, 41.6 days, 2026 setups, target 1R, fills counted only from the
# bar the setup became detectable:
#
#   with the daily trend      1011 setups   +0.103 R/setup  ± 0.021
#   against the daily trend   1015 setups   -0.008 R/setup  ± 0.020
#   difference                +0.110 R  ± 0.029  (+3.8 SE)  -- meaningful
#
# For contrast, six engine-parameter variants, two entry timeframes, five exit
# families and four targets all came back inside noise. Halves alert volume,
# and takes the expectancy from zero to positive.
#
# Trust the SEPARATION, not the level. The gap has come back at +0.135, +0.095
# and +0.110 across two windows, two symbol sets and two scoring methods. The
# level under it ranged from -0.05 to +0.32 over the same comparisons. Still
# one regime at a time, and these figures exclude fees.
# 1 suppresses counter-trend signals entirely; 0 sends everything and lets the
# label on each alert decide. Every alert carries "with" or "AGAINST" the trend
# either way, so 0 is the setting for judging them yourself rather than missing
# them. /trend on|off flips it from Telegram with no restart.
RIPTIDE_TREND_FILTER=0
#
# TWO timeframes, and they used to be one setting. Measured on Min30 confirmed
# setups, net of fees, with-trend minus against-trend, 23 symbols:
#
# RE-MEASURED after the scorer correction (see MEASUREMENTS.md). The filter is
# back on daily; the 4h switch was made on bad numbers.
#
#   SuperTrend  1D  +0.250  +2.4 SE      (was read as +0.150 / +2.2)
#   SuperTrend  4h  +0.214  +2.0 SE      (was read as +0.255 / +3.7)
#   DI          1D  +0.266  +2.5 SE
#   DI          4h  +0.011  +0.1 SE
#
# DI on 4h is the one reading the correction did not move — a flat null before
# and after. They stay two settings because the question is separable, which
# the 4h experiment established even though its answer was wrong. Nothing here
# clears 3 SE: this is the better of two weak readings, and /stats settles it.
#
# The Pine's "Higher timeframe" must match RIPTIDE_TREND_INTERVAL or the chart
# filters on a different line than the bot; deploy/check-parity.py fails on it.
# The indicator has no DI at all, so RIPTIDE_DI_INTERVAL has no chart twin.
# RIPTIDE_TREND_INTERVAL=Day1
# RIPTIDE_DI_INTERVAL=Day1
# RIPTIDE_TREND_LEN=14
# RIPTIDE_TREND_FACTOR=5.0

# The timeframe the POINT OF INTEREST is read on. Blank means "whatever
# RIPTIDE_TREND_INTERVAL is", which is what the bot did before this key existed
# — poi_at read TREND_INTERVAL directly, so the 9 Sep move to Hour8 took the
# POI with it, unmeasured, and shortened its zone life from thirty days to ten
# (POI_MAX_AGE_BARS is 30 BARS of this timeframe).
#
# LEAVE IT BLANK unless you mean to separate them. Setting it costs one extra
# kline request per symbol per TTL, because trend._series serves the
# SuperTrend, the DI and the POI from one cached fetch only while they share
# an interval.
#
# Measured on Min60 over 333 days (research/studies/poi_tf.py, 6015 signals):
# Hour8 against Day1 is |z| 0.1 and a ten-day zone life against a thirty-day
# one is |z| 0.1. There is nothing to gain by turning this knob on 1h.
#
# SET TO Day1 ON 11 SEP, WHICH IS A REVERT AND NOT AN EXPERIMENT. Min30 was
# then re-measured, and it is the one place the POI does anything. Twelve cells
# — three timeframes, confirmed and early, both zone maps, same rows, trend
# agreeing — with "win+" counting how many of eight non-overlapping 42-day
# windows came out positive (research/studies/poi_recheck.py):
#
#     tf   stream     POI      gap      SE   |z|   win+
#     15m  confirmed  daily  -0.065   0.075   0.9   5/8
#     15m  confirmed  8h     -0.055   0.067   0.8   4/8
#     15m  early      daily  -0.028   0.030   0.9   3/8
#     15m  early      8h     -0.034   0.028   1.2   4/8
#     30m  confirmed  daily  +0.160   0.099   1.6   6/8   <- the only one
#     30m  confirmed  8h     +0.006   0.087   0.1   4/8
#     30m  early      daily  -0.058   0.041   1.4   3/8
#     30m  early      8h     -0.085   0.039   2.2   2/8
#     1h   confirmed  daily  +0.046   0.117   0.4   3/8
#     1h   confirmed  8h     +0.006   0.110   0.1   5/8
#     1h   early      daily  -0.051   0.057   0.9   4/8
#     1h   early      8h     -0.038   0.055   0.7   3/8
#
# One cell is positive with any strength and it needs the DAILY map: Min30
# confirmed, +0.160 in six of eight windows with a median of +0.331. Its Hour8
# twin is +0.006 in four of eight, median +0.019 — a coin toss, and the coin
# toss is what was deployed between 9 and 11 Sep by accident.
#
# Counted fairly this is a tie on cells, three each. It is not close on size:
# Day1's win in the one working cell is +0.154 and the largest Hour8 win
# anywhere is +0.013.
#
# THE ZONE LIFETIME COMES BACK TOO, and that is half the point. POI_MAX_AGE_BARS
# is 30 BARS of this timeframe, so Day1 restores a thirty-day memory where Hour8
# gave ten. Thirty days is the measured value; engine.py notes the unconstrained
# version "pointed the WRONG way".
#
# COSTS one extra kline request per symbol per hour — trend._series caches on
# (symbol, interval) with a 3600s TTL, so the SuperTrend and DI still share one
# Hour8 fetch and the POI now needs its own Day1 one. At 120 symbols that is
# 120 extra requests an hour against roughly 1440 already made.
#
# NOT A VERDICT ON THE FILTER ITSELF. Every early cell above is negative in both
# maps — six of six — and 30m early on Hour8 reaches -0.085 at |z| 2.2, the only
# cell in the study clearing 2 SE and the one saying the filter HURTS. Early is
# about 80% of the stream. Gating it on the POI is a GRADES question, not this
# key, and PREREG_poi_forward.md is the test that decides it.
RIPTIDE_POI_INTERVAL=Day1

# ── target and break-even ───────────────────────────────────────────────────
# /stats scores at 2R, not 1R. It was 1.0, so the tracker was measuring a trade
# nobody takes. Corrected-scorer totals on confirmed setups: 1R +20.4,
# 1.5R +39.5, 2R +52.8, 3R +61.9 — monotone, each step about 1.5 SE, so this
# follows the trade rather than claiming the ladder is proven. Rows settled
# before the change were scored at 1R and are not comparable with later ones.
# RIPTIDE_TRACK_TARGET_R=2.0
#
# The break-even rule is OFF (RIPTIDE_BE_ARM_R=0). It shipped at 1.5R for
# months and was never measured; when it was, it lost at every arm level on
# both signal types — at a 2R target, arming at 1.0R cost 0.074 R per setup
# (2.5 SE), 1.5R cost 0.019, 1.75R cost 0.008. It converts trades that would
# have reached target into small scratches, and 26% of confirmed setups reach
# 3R. The alert no longer prints the BE line unless this is turned back on.
# RIPTIDE_BE_ARM_R=0.0

# ── risk caps, one per signal type ──────────────────────────────────────────
# These were a single setting until they were swept properly — by re-running
# the ENGINE at each cap, not by filtering its output, since a rejected gap
# does not end the search and a tighter cap yields a later, tighter gap off
# the same raid rather than simply fewer signals.
#
#   confirmed  2.5 ATR  242 signals  +0.260 R  total +63.0
#              4.0 ATR  544 signals  +0.110 R  total +59.7
#   early      4.0 ATR 1347 signals  +0.114 R  total +153.4
#              2.5 ATR 1186 signals  +0.121 R  total +143.2
#
# The confirmed difference is +0.151 at 2.5 SE with the same sign on all four
# splits. Read it for what it is: total R is inside noise, so this is the SAME
# money from 44% of the trades. What improves is exposure and R per trade, not
# the edge. Early wants the opposite — tightening it costs total R the whole
# way down while R per signal rises, which is what deleting winners looks like.
#
# Live effect: confirmed alerts fall from 13.4 to 6.0 a day. Early is
# unchanged at 33.4. The Pine's two inputs must match or the chart draws
# trades the bot never sends; deploy/check-parity.py fails on either.
# RIPTIDE_MAX_RISK_ATR=2.5
# RIPTIDE_EARLY_MAX_RISK_ATR=4.0

# ── outcome tracking ────────────────────────────────────────────────────────
# Score every alert forward against the candles the scan already fetches, and
# read the running result with /stats. No extra requests, no effect on what
# gets alerted, and still no exchange key or order path — a "fill" here is a
# price level touched on a chart, not a position.
#
# This exists because everything else in this file was measured on one 41-day
# window, over symbols chosen by their turnover today, in a single ranging
# regime. That is enough to justify the trend filter and not enough to trust
# it. These numbers accumulate out-of-sample instead. Where the two disagree,
# believe these.
#
# Only setups that passed the freshness gate are tracked, sent or not, so a
# /pause does not put a hole in the sample and a first run does not backfill
# 600 bars of history into what is meant to be forward data.
#
# 0 turns it off entirely.
RIPTIDE_TRACK=1

# Bars after the gap forms in which a limit at the entry may fill. Past this
# the setup is recorded as never filled — a result, not a discard, and it is
# counted as 0R in the per-setup figure so fill rate cannot be gamed.
# RIPTIDE_TRACK_FILL_BARS=10

# Bars a filled setup is followed before being marked to market at the close.
# 60 Min30 bars is 30 hours.
# RIPTIDE_TRACK_HORIZON_BARS=60

# Target in R for the simulated rule. 1.0 is what measured best. MFE and MAE
# are stored per setup either way, so a different fixed target can be scored
# from the same rows later without re-running anything.
# RIPTIDE_TRACK_TARGET_R=1.0

# Weekly high/low pools. Measured over 41.6 days on 50 symbols: 295 weekly
# sweeps produced ZERO setups. By the rule of three that bounds their
# conversion below about 1%, against 28% for pivot pools and 9% for daily.
# They cost sweep heads-ups and return nothing, so 0 is the honest setting.
#
# Kept as a switch rather than removed: "0 of 295" bounds the rate, it does not
# prove it is zero forever, and a weekly level is exactly the kind of thing
# that might matter in a trending regime this window did not contain.
RIPTIDE_USE_WEEKLY=0

# ── engine calibration ──────────────────────────────────────────────────────
# Every Cfg field can be overridden as RIPTIDE_<FIELD>. Defaults are unchanged
# unless a line below is uncommented, and /status lists whatever is active.
#
# The reference indicator's own settings panel exposes these values, and they
# do NOT match the defaults. Measured over 12.5 days on 20 symbols:
#
#   as shipped                   4269 pivots  1109 sweeps  245 setups
#   pivot_right=1                5281         1347         331
#   + tol 0.20, overshoot 0.10   5281         1232         288
#   + grab window 12 (all four)  5281         1259         157
#
# They pull in opposite directions: the reference finds 24% more swings but
# gives the reversal 12 bars instead of 50, so the complete system produces
# FEWER setups, not more. Change one at a time and watch, rather than all at
# once.
#
# NOW MEASURED ON EXPECTANCY, not just counts. 23 symbols, 41.6 days, net of
# 0.08% round-trip fees:
#
#                          setups   med risk    GROSS      NET
#   as shipped                568      1.84%   +0.068   +0.027
#   reference, all four       513      1.60%   +0.004   -0.044
#     only pivot_right=1      822      1.69%   +0.062   +0.017
#     only tol_atr=0.20       524      1.85%   +0.072   +0.030
#     only overshoot=0.10     518      1.87%   +0.061   +0.019
#     only grab_bars=12       393      1.76%   +0.060   +0.016
#
# The full reference config is 0.071 R behind at 1.4 SE — nominally worse,
# statistically indistinguishable. Each parameter alone is within noise of the
# shipped value; only the combination drifts, which is as likely to be an
# interaction as it is to be chance on one window.
#
# So there is no evidence for changing, and none for claiming our numbers are
# better either. What this DOES settle is that the deviation is deliberate and
# costs nothing measurable — the four values below are the reference's, ours
# are ours, and the two systems are not expected to draw identical charts.
#
# RIPTIDE_PIVOT_RIGHT=1            # reference: 1 (shipped: 2) — the only one
#                                  # that causes missed pivots
# RIPTIDE_TOL_ATR=0.20             # reference "Pivot Max Range by ATR"
# RIPTIDE_MAX_OVERSHOOT_ATR=0.10   # reference "Pivot Max Tested Range by ATR"
# RIPTIDE_MAX_BARS_AFTER_GRAB=12   # reference "Look Back Max Bars for Grab+MSS"

# How long the engine keeps looking for a gap after the shift confirms, in
# bars. Mirrors "Keep looking for zones for (bars)" in the Pine, which is 10.
#
# Tried at 5 and reverted. Two separate findings came out of that test and they
# deserve different amounts of trust:
#
#   certain    5 drops 55 of 2034 setups over 41.6 days (2.7%) and alters
#              none. That is a count, not an estimate.
#   not        those 55 scored +0.319 against +0.044 for the ones kept
#              (+0.586 vs +0.089 trend-aligned, +2.5 SE). 55 samples, in a
#              project that has already watched a confident ranking evaporate
#              on the next window. Do not act on this figure.
#
# The count alone settles it. Losing 2.7% of setups is a definite cost; the
# case for paying it rested entirely on the figure above, and that figure is
# not strong enough to buy anything.
#
# The asymmetry matters too. A dropped setup is gone for good — it is still
# recorded, so dedupe blocks it forever — while an unwanted alert can just be
# ignored, and every one carries its trend label and age to judge it by. And
# with outcome tracking live, setups whose gap arrives on bars 6 to 10 are now
# being scored: keeping them is what makes the question answerable. Setting
# this to 5 would foreclose the measurement that would justify setting it to 5.
#
# outcomes.armed_time - outcomes.mss_time is exactly that lag, so /stats data
# can be split on it once enough has accumulated.
# RIPTIDE_MAX_BARS_AFTER_MSS=5

# Where the entry-gap search starts. Mirrors the Pine's "Look for entry zones
# from" — set that to "MSS candle only" to match, or the chart will show zones
# the bot does not alert on.
#
#   grab   every imbalance across the whole move from the raid to the break,
#          including gaps that formed BEFORE the break
#   mss    the break bar onwards only, then up to max_bars_after_mss bars
#          waiting for a fresh one
#
# "grab" is the Pine default and was the shipped behaviour. The problem with
# it: the stop is pinned at the raid extreme, so as price runs away the newer
# gaps fail max_risk_atr and the search keeps walking BACK until one fits. The
# result is an entry from many bars ago, far below market, alerted the moment
# the shift confirms. PEPE on 5 Sep handed back a gap from 21 bars (10.5h)
# earlier with price already 4.7% past it.
#
# Measured, 50 symbols, 41.6 days:
#
#                   setups   median dist   >2% away   >5%   fill rate
#   grab              2040        0.91%         24%    7%         50%
#   mss               1215        0.44%         10%    3%         71%
#
#   R/setup, all              +0.051 ± 0.015   vs   +0.051 ± 0.024
#   R/setup, trend-aligned    +0.099 ± 0.022   vs   +0.137 ± 0.033
#
# Expectancy is NOT better — the two are indistinguishable, and the aligned
# figure is under 1 SE apart. The reason to switch is the fill rate: 71%
# against 50%, which is a count on 3255 setups, not a noisy estimate. "grab"
# spends 57% of its setups on gaps that formed before the shift and a quarter
# of all alerts on entries price has already left behind.
#
# It is not simply "40% fewer setups". With "mss" the engine keeps checking
# each new bar for up to max_bars_after_mss, so it waits for a real gap in the
# impulse instead of reaching back for a stale one, and only gives up if none
# forms. Set to grab to restore the old behaviour.
#
# DOES "mss" ALERT LATE? Yes, and it is worth the delay. Bars from the
# structure break to the alert:
#
#                same bar   1-2 bars   3+ bars   median   p90   retrace needed
#   grab              81%        16%        3%        0     1        +1.43 ATR
#   mss               41%        46%       13%        1     5        +0.73 ATR
#
# So the message lands a median of one bar (30m) later, and in the worst 10%
# of cases five. What it buys: the entry sits half as far from where price
# actually is, and fills 72% of the time against 50%.
#
# The waiting does not disappear under "grab" — it moves to AFTER the alert,
# where half the time it never resolves. Median wait from alert to fill is 2
# bars in BOTH modes, so you are in the trade one bar later and 22 points more
# often. And within "mss" the DELAYED alerts are the better half, not the
# worse one: fired 1+ bars after the break they score +0.061 and fill 81%,
# against +0.022 and 58% for same-bar alerts.
#
# Per FILLED trade "grab" is nominally ahead (+0.084 vs +0.063, 0.5 SE — not a
# real difference). Its filled trades are fine; it simply leaves half its
# alerts on entries price never comes back to.
RIPTIDE_FVG_SCAN_FROM=mss

# Break-even: arm the stop at this many R, and move it to lock in be_lock_r
# rather than exactly to entry — a stop at entry still pays the round trip.
# Mirrors beLockR in riptide-indicator.pine.
# RIPTIDE_BE_ARM_R=1.5
# RIPTIDE_BE_LOCK_R=0.1
#
# Target measured on trend-aligned setups only (1006 samples, 41.6 days,
# fills counted only from the bar the setup became detectable):
#
#   1.0R, no break-even          +0.103 +/- 0.022
#   1.5R, arm 1.0R, lock 0.1R    +0.103 +/- 0.025    +0.000 paired (+0.0 SE)
#   2.0R, arm 1.0R, lock 0.1R    +0.102 +/- 0.027    -0.001 paired (-0.1 SE)
#   3.0R, arm 1.5R, lock 0.1R    +0.116 +/- 0.034    +0.013 paired (+0.5 SE)
#
# Nothing separates. An earlier run of this comparison found the far target
# clearly worst and the ordering perfectly monotonic; on a later window, with
# the scoring corrected, 3R is nominally BEST and every pair is inside half a
# standard error. The ranking was never real — it was one window's noise, read
# as a result. Five trailing-stop families came back the same way.
#
# So the alert quotes 1R, break-even and 3R and lets you choose. That is not
# indecision: it is what the measurement supports.

# ── tuning ──────────────────────────────────────────────────────────────────
# How old a setup may be when the alert fires, in bars. Measured from the bar
# it became DETECTABLE — the later of the shift and the gap, since it needs
# both. This does NOT limit how long the sweep-to-entry sequence may take:
# that is max_bars_after_grab (50 bars) and max_bars_after_mss (10), and a long
# wait there is normal and fully alerted. Median sweep-to-entry is 14 bars,
# quartiles 7 and 25.
#
# It used to measure from the shift bar, which binned every setup whose gap
# took more than one bar to arrive — 76 of 2035 setups over 41.6 days, silently,
# and recorded them so dedupe made the loss permanent. This is not the knob for
# taking slower setups; those are no longer being dropped.
#
# MINIMUM 2, and 2 is what "no delayed alerts" means. Candle.t is the bar's
# OPEN time, so the freshest possible signal is already step+10s old when the
# scan sees it: a 1-bar window cannot contain it and would silence the bot
# completely. The code clamps 1 up to 2 with a loud warning rather than
# honouring a value whose only effect is to mute everything.
#
#   2  only the scan that fires right after the setup appears  <- no old alerts
#   3  also the scan after that, so one missed cycle still delivers
#
# At 2, a setup found while the bot is down or during a failed scan is lost
# for good — it still gets recorded, and dedupe then blocks it forever. A
# normal restart is fine: RIPTIDE_SCAN_ON_START scans immediately, and any
# setup from the bar that just closed is under 2 bars old however the restart
# is timed.
RIPTIDE_FRESH_BARS=2

# Sweep freshness. Minimum 2 — at 1 nothing is ever sent, see the README.
RIPTIDE_SWEEP_FRESH_BARS=2

# Minimum 24h turnover in USDT. Only applies when RIPTIDE_SYMBOLS is unset.
RIPTIDE_MIN_VOL=1000000
RIPTIDE_TOP_N=120
RIPTIDE_EXCLUDE_TRADFI=1

# Parallel requests. Raise if a full-market cycle runs long against the bar.
RIPTIDE_CONCURRENCY=8

# Minimum seconds between requests, across the whole process. CONCURRENCY caps
# how many are IN FLIGHT; this caps the RATE, and they are not the same thing.
#
# RAISED FROM 0.07 TO 0.12 ON 12 SEP, ON EVIDENCE. 0.07 (about 14 a second) was
# measured as safe on a 60-symbol universe. At 115 symbols across three
# timeframes plus Hour8 POI and Day1 context — roughly 600 requests a cycle —
# MEXC started refusing 20-26 symbols PER TIMEFRAME, every cycle, with
# {"success": false, "code": 510, "message": "Requests are too frequent"}.
#
# THAT REFUSAL ARRIVES AS HTTP 200, which is why it went unnoticed: the retry
# path only watched for 429, so a throttle was passed downstream as "this
# symbol has no candles" and the scan summary still said "scanned 115 symbols".
# A quarter of the universe was dark and every line in the log looked normal.
# riptide/exchange.py now reads the body, and tests/test_throttle.py pins it.
#
# THIS IS ONLY THE STARTING POINT. The true limit is undocumented for this
# endpoint and depends on what else shares the IP, so the pacer widens itself
# on every refusal and narrows again when they stop, capped so a fully widened
# cycle still fits in half a scan interval. /status shows the current widening
# whenever it is above 1, so being throttled is visible rather than silent.
#
# 0.12 is about 8 a second: a 600-request cycle spreads over ~72 seconds.
# 0 disables pacing entirely, adaptation included. Do not.
RIPTIDE_MIN_REQUEST_GAP=0.12

# ── Open interest and funding log ───────────────────────────────────────────
#
# MEXC serves holdVol (open interest) and fundingRate ONLY as a live snapshot
# from contract/ticker. There is no history endpoint for either, so unlike
# volume they cannot be backtested at all — the only way they ever become
# testable is to record them forward and wait. This starts that clock.
#
# Why they are worth the wait: open interest is the one genuine supply/demand
# reading a futures venue offers. When price runs a pool, OI FALLING means
# positions are being closed out — a stop run, which is what the strategy
# assumes. OI RISING means new money is positioning — a breakout, and the
# reversal is wrong. Two identical candles, opposite meanings, and nothing in
# the OHLC can tell them apart.
#
# The volume work already hinted at this from outside: sweep-to-setup
# conversion falls from 26.4% to 6.5% as sweep volume rises (+15.6 SE over
# 7869 sweeps), which says loud raids are breakouts. Open interest would say
# so directly, per bar, instead of by inference.
#
# Costs one request per scan — contract/ticker returns every symbol at once —
# writes to its own table, and is read by nothing that decides an alert.
# /status shows how much has accumulated. See riptide/market.py.
RIPTIDE_LOG_MARKET=1

# Days of snapshots kept.
# RIPTIDE_MARKET_KEEP_DAYS=180

# Minimum 24h turnover for a symbol to be SNAPSHOTTED — deliberately a third of
# RIPTIDE_MIN_VOL rather than equal to it. The scanned set is the top N by
# turnover and symbols near that line rotate every few hours, so logging only
# the scanned ones produced short broken series: the first 2.8-day export had
# 94 symbols but only 20 covering more than 95% of the bars. A broken series is
# nearly worthless here, because the quantity tested is the CHANGE in open
# interest across the raid, which needs the previous bar too.
#
# The ticker response already carries all 1196 contracts in one request, so a
# lower floor costs no extra request and no extra latency — only rows. This
# default logs about 180 symbols against the ~106 currently eligible to scan,
# roughly 1.5M rows over the full retention, tens of megabytes. Scanned symbols
# are always logged whatever their turnover says.
# RIPTIDE_MARKET_MIN_VOL=1000000

# ── Trendline breakout heads-ups ────────────────────────────────────────────
#
# A break of a trendline drawn from confirmed pivots, on every symbol at once,
# in ONE digest per bar close. riptide/trendline.py is an exact port of the
# published "Liquidity Trendline With Signals" indicator, and riptide/watch.py
# is the watch list around it. It is the one thing TradingView will not do:
# alert on an indicator across sixty pairs so you know which chart to open.
#
# It fires on exactly the blue and red arrows the indicator draws, and the
# condition is STRICTER than "closes beyond the line": the Pine tests
# `b.l > top.get_y2()`, so the whole candle including its wick has to be clear.
# A candle that closes past the line but still wicks into it prints no arrow
# and sends no alert.
#
# IT IS NOT A TRADE AND IT IS NOT IN /stats. The same breakout went through the
# same scorer as everything else in this project: net R per signal is NEGATIVE
# on both halves of the window and indistinguishable from a random entry of the
# same shape, and over the next 8 bars it continues 44-48% of the time against
# a 50% coin flip. So the message carries no entry, no stop and no grade, and
# nothing here is armed for outcome tracking — there is no outcome to track.
#
# THE RATE IS THE PRODUCT DECISION, because a heads-up fails by arriving too
# often to read rather than by losing money. Measured across 60 symbols in
# research/studies/trendline_rate.py, before the slope gate:
#
#     Min15   1.82 per symbol/day   109 a day       worst close: 29 at once
#     Min30   0.87                   52                          21
#     Min60   0.42                   25                          16
#     Hour4   0.11                    7                          20
#
# 15m and 30m together is 161 a day raw, which is a feed rather than an alert.
# The slope gate below is what makes that pair viable. Change either live with
# /trendline 15m,30m or /trendline slope 0.2 — no restart.
RIPTIDE_TRENDLINE_ALERTS=1
RIPTIDE_TRENDLINE_INTERVALS=Min15,Min30,Min60

# Min60 added 11 Sep alongside the 1h setup stream, so the watch covers every
# timeframe the bot now scans. It is the CHEAPEST of the three in message
# terms: measured over 60 symbols, 1h breaks land 25 a day across the universe
# against 52 on 30m and 109 on 15m, and a 1h close is also a 30m and a 15m
# close, so all three land in the SAME digest rather than three messages. A
# symbol breaking on more than one at once is shown once, on the slowest.
# Raw rate goes 161 a day to 186, and the slope gate below is what makes any of
# it readable. Change live with /trendline 15m,30m,1h — no restart.

# The steepness gate, in |slope| / ATR(200) at the break. A flat trendline is a
# horizontal level, and price crossing a horizontal level is the most ordinary
# thing a chart does. This drops those.
#
#     >= 0.00   100% kept   161 a day at 15m+30m
#     >= 0.05    68%        110
#     >= 0.10    39%         63
#     >= 0.15    20%         32   <- the default
#     >= 0.20    10%         16
#
# IT IS A VOLUME CONTROL, NOT A QUALITY FILTER, and the difference was measured
# rather than assumed. research/studies/trendline_slope.py asked whether steep
# breaks follow through more often than flat ones over the next 8 bars:
#
#     Min15 discovery   flat 43.4%   steep 52.4%   +9.0pp   +4.4 SE
#     Min15 HELD OUT    flat 46.0%   steep 43.0%   -3.1pp   -1.4 SE
#     Min30 HELD OUT    flat 43.8%   steep 44.0%   +0.2pp   +0.1 SE
#
# The discovery half said steep breaks continue nine points more often at 4.4
# SE. The held-out half reversed it. That is what a fitted result looks like,
# and the only reason it was caught is that the cut was chosen on one half and
# read on the other. Steeper means fewer and better-looking, not more likely to
# work, and the alert claims nothing more than that.
RIPTIDE_TRENDLINE_MIN_SLOPE=0.15

# The indicator's own inputs. Left settable so a chart configured differently
# can be matched — not because any value has been measured as better. None has.
# RIPTIDE_TRENDLINE_PIVOT=5
# RIPTIDE_TRENDLINE_SPACE=2.0

# Lines in one digest before it says "+N more". Telegram's own 4096-character
# cap is enforced separately; see watch.MAX_CHARS.
# RIPTIDE_TRENDLINE_MAX_LINES=20


# How recent a same-direction trendline breakout must be to mark a trade alert
# with 📐, in bars of that signal's own timeframe. 0 uses the engine's
# early_max_bars (10), which is its own notion of "recent enough to be the
# same event".
#
# IT MARKS AND MEASURES. IT FILTERS NOTHING, AND MUST NOT. Offline
# (research/studies/early_breakout.py) the confluence scored +0.206 R over 3773
# early signals, positive in all five panels, above a 25-seed placebo floor in
# every one, and replicating at +0.154 on confirmed setups — but only +0.7 SE
# on the held-out half against a bar of 2, and a break the OTHER way does
# nothing at all. That is an encouraging shape, not evidence. /stats scores the
# tag forward so the live sample can settle it.
#
# The window is load-bearing rather than cosmetic. The raw bars-since-break is
# stored, and on the first live scan 40% of signals had SOME earlier break
# behind them — 38 bars, 69, 108 — while the measured effect is gone by 20:
#
#     window   kept   difference vs no break
#        3      1%          +0.126
#        5      2%          +0.178
#       10      3%          +0.206   <- the default
#       20     10%          +0.052
#       40     26%          -0.002
#
# At 10 bars the live rate is 4% of signals, matching the study.
# RIPTIDE_TRENDLINE_CONFLUENCE_BARS=0


# ── Exhaustion count heads-ups ──────────────────────────────────────────────
#
# The 9-count and 13-count off riptide-reversal.pine, on every symbol at once,
# in ONE digest per bar close — the same shape as the trendline watch above and
# for the same reason: TradingView will not alert on an indicator across sixty
# pairs. riptide/exhaust.py runs the counts, research/td.py is the study copy,
# and tests/test_exhaust.py asserts the two agree bar for bar so the numbers
# below keep describing what the bot actually sends.
#
# Four groups, strongest first:
#
#     STRONG LONG      a completed 13 on a falling count   (T13)
#     STRONG SHORT     a completed 13 on a rising count    (T13)
#     possible long    a completed 9, perfected            (M9*)
#     possible short   a completed 9, perfected            (M9*)
#
# IT IS NOT A TRADE AND IT IS NOT IN /stats, and here the measurement did not
# merely come back empty — it came back POINTING THE OTHER WAY.
# research/studies/exhaustion.py scored 🎯 picks landing near a completed count
# against the same picks elsewhere, and then ran the opposite-direction control:
#
#     picked, count within 5 bars     same direction  +0.093
#                                     OPPOSITE        +0.273
#     sent, count within 3 bars       same            +0.057
#                                     OPPOSITE        +0.296   (z 2.3)
#
# A signal whose control scores three times what it does is not a weak edge, it
# is a shared regime being read the wrong way round. So the digest says "no
# edge, and the opposite direction scored better" on its own face, carries no
# entry, no stop and no grade, and nothing here is armed for outcome tracking.
# It tells you which chart to open. Nothing else.
#
# SO IT SHIPS OFF, and that is the setting below. The stream is built, tested
# and dormant. Turn it on with /exhaust on when you want to watch the counts
# against the chart for a few days, and /exhaust off when you have seen enough.
# Nothing about it runs until you do.
#
# THE RATE IS THE OTHER PRODUCT DECISION, and it is measured rather than
# recalled — research/studies/exhaust_rate.py, 59 symbols over 333 days. Rerun
# it rather than trusting this table:
#
#     tf     M9/day   M9*/day   T13/day    both   both*
#     15m      128        96        40      167     136
#     30m       66        49        19       85      68
#     1h        34        24         9       43      34
#     ALL      227       169        68      295     237
#
# These are ROWS, not messages: the watch sends one digest per bar close
# carrying every symbol that completed on it, so 1h is at most 24 messages.
# Rows are still the unit that matters, because a forty-row digest is the one
# that does not get read.
#
# Everything on is 295 rows a day — three and a half times Riptide's entire
# alert volume and sixteen times the number of 🎯 picks. So when you do switch
# it on it starts in the QUIET CORNER of that table: 1h only, perfected 9s
# only, 34 a day, which sits beside the trendline digest's ~37. Widen it
# deliberately, and note that adding 15m alone quadruples the traffic.
#
# Change any of it live with /exhaust — no restart.
RIPTIDE_EXHAUST_ALERTS=0
RIPTIDE_EXHAUST_INTERVALS=Min60

# "both", "momentum" or "terminal". The biggest volume lever after the
# timeframe: terminal alone is 68 rows of the 295, under a quarter of the
# traffic, and it is also the rarer and stronger of the two counts.
# RIPTIDE_EXHAUST_KINDS=both

# Whether a plain 9 counts or only a perfected one (the M9* on the chart, where
# bar 8 or 9 undercut bars 6 and 7). 169 of 227 nines perfect, so this is not
# the lever the timeframe is — but an unperfected 9 is the weakest thing the
# indicator prints and the most likely to be misread as a signal.
# RIPTIDE_EXHAUST_PERFECT_ONLY=1

# How recent a completion must be, in bars of its own timeframe. Minimum 2 for
# the reason every other freshness window here has one: a bar that has just
# closed is already one full step old, so a 1-bar window mutes the stream
# silently. Values below 2 are clamped and logged.
# RIPTIDE_EXHAUST_FRESH_BARS=2

# Rows in one digest before it says "+N more". Telegram's own 4096-character
# cap is enforced separately; see exhaust.MAX_CHARS.
# RIPTIDE_EXHAUST_MAX_LINES=20
