# Riptide scanner — runtime settings.
#
# Edit this file on GitHub (web or mobile app), commit, and the server picks it
# up within ~5 minutes and restarts itself. No SSH needed.
#
# This file is PUBLIC to anyone who can read the repo. Secrets never go here —
# TELEGRAM_TOKEN and TELEGRAM_CHAT_ID live in /home/ubuntu/riptide/.env, mode
# 600, and are not in git.
#
# systemd reads this as an EnvironmentFile: KEY=value, no quotes, no `export`,
# no spaces around `=`. Lines starting with # are ignored.
#
# Full reference: README_riptide_bot.md

# ── what to scan ────────────────────────────────────────────────────────────
RIPTIDE_INTERVAL=Min30

# Comma separated, no spaces. Delete this line entirely to scan every USDT
# perpetual above RIPTIDE_MIN_VOL of 24h turnover (~96 symbols at the default).
RIPTIDE_SYMBOLS=BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,ZEC_USDT,HYPE_USDT,PEPE_USDT,DOGE_USDT,SUI_USDT,ARB_USDT,ENA_USDT,USELESS_USDT,TAO_USDT,UNI_USDT,LINK_USDT,ADA_USDT,WLD_USDT,PUMPFUN_USDT,AKE_USDT,DASH_USDT

# ── alerting ────────────────────────────────────────────────────────────────
# Sweep heads-ups. 0 turns them off and leaves only finished setups.
RIPTIDE_SWEEP_ALERTS=1

# Which pools raise a heads-up. Unset = all, which is what you want while
# checking output against the chart. Narrow to Pivot later if the volume is
# too high — it converts best (28%, against Day 9% and Week 2%).
# RIPTIDE_SWEEP_SRC=Pivot

# Timezone for the daily heartbeat. Display only — bar alignment and every
# internal calculation stay on UTC. IANA name.
RIPTIDE_TZ=Asia/Karachi

# Telegram send attempts. Retries only failures that provably did not deliver
# (rate limit, 5xx, connection refused); an ambiguous timeout is never retried,
# so an alert can be lost but never duplicated.
RIPTIDE_TG_RETRIES=4

# Accept /status /scan /pause /resume /update /restart from Telegram. Only
# TELEGRAM_CHAT_ID is obeyed; everyone else is ignored without a reply. There
# is still no exchange key and no order path anywhere in the bot. 0 disables.
RIPTIDE_TG_COMMANDS=1

# ── tuning ──────────────────────────────────────────────────────────────────
# Only alert on shifts this recent, in bars.
RIPTIDE_FRESH_BARS=3

# Sweep freshness. Minimum 2 — at 1 nothing is ever sent, see the README.
RIPTIDE_SWEEP_FRESH_BARS=2

# Minimum 24h turnover in USDT. Only applies when RIPTIDE_SYMBOLS is unset.
RIPTIDE_MIN_VOL=3000000

# Parallel requests. Raise if a full-market cycle runs long against the bar.
RIPTIDE_CONCURRENCY=8
